    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS8</title>
    <script>
        var p=parseFloat(prompt("Enter The Principal Amount:"));
        var r=parseFloat(prompt("Enter The Rate Of Interest:"));
        var t=parseFloat(prompt("Enter The Time Period:"));
        var si=(p*r*t)/100;
        document.write("The Simple Interest is: " + si);
    </script>
