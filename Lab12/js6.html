<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS6</title>
    <script>
        var a=parseFloat(prompt("Enter The First Number:"));
        var b=parseFloat(prompt("Enter The Second Number:"));
        var c;
        c=a;
        a=b;
        b=c;
        document.write("After Swapping: <br>");
        document.write("First Number: " + a + "<br>");
        document.write("Second Number: " + b);
    </script>
</head>
<body>
    
</body>
</html>
