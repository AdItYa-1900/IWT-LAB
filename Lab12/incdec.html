<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Increment/Decrement</title>
    <script>
var a=5,b,c;
b=a++ + ++a;
c=++a + a++;
document.write("value of b="+b+"<br>");
document.write("value of c="+c+"<br>");
var d=5,e,f;
e=d--;
f=d--;
document.write("value of e="+e+"<br>");
document.write("value of f="+f+"<br>"); 
</script>
</head>
<body>
    
</body>
</html>
