<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Case</title>
    <script>
        var day=1;
        switch(day)
            {
            case 1:
            document.write("the day is sunday"+ "<br>");
            break;
            case 2:
            document.write("the day is monday"+ "<br>");
            break;
            case 3:
            document.write("the day is tuesday"+ "<br>");
            break;
            case 4:
            document.write("the day is wednesday"+ "<br>");
            break;
            case 5:
            document.write("the day is thursday"+ "<br>");
            break;
            case 6:
            document.write("the day is friday"+ "<br>");
            break;
            case 7:
            document.write("the day is saturday"+   "<br>");
            break;
            default:
            document.write("wrong choice"+ "<br>");
            } 
            var ch="u";
            switch(ch)
            {
            case 'a':
            case 'e':
            case 'i':
            case 'o':
            case 'u':
            case 'A':
            case 'E':
            case 'I':
            case 'O':
            case 'U':
                document.write("the character is a vowel"+ "<br>");
            break;
            default:
            document.write("the character is not a vowel"+ "<br>");
            }
            var a=10,b=2,c;
            var choice="*";
            switch(choice)
            {
            case '+':
            c=a+b;
            break;
            case '-':
            c=a-b;
            break;
            case '*':
            c=a*b;
            break;
            case '/':
            c=a/b;
            break;
            case '%':
            c=a%b;
            break;
            default:
            document.write("wrong choice"+ "<br>");
            }
            document.write("calculated value="+c+ "<br>"); 
    </script>
</head>
<body>
    
</body>
</html>
