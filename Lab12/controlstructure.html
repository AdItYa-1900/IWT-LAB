<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Structure</title>
    <script>
        var a=8;
        if(a%2==0)
        document.write("number is even"+"<br>"); 
        var b=4;
        a=3;
        if(a>b)
        document.write("a is greater"+" <br>");
        else
        document.write("b is greater"+"<br>"); 
        var y=2018;
        if(y%100!=0)
        if(y%4==0)
        document.write("leap year"+"<br>");
        else
        document.write("not"+"<br>"); 
        else
        if(y%400==0)
        document.write("leap year"+"<br>");
        else
        document.write("not" + "<br>");
        var a=45,b=23,c=90;
        if(a>b)
        if(a>c)
        document.write("a is greatest");
        else
        document.write("c is greatest"+"<br>");
        else
        if(b>c)
        document.write("b is greatest"+"<br>");
        else
        document.write("c is greatest"+"<br>");
        var n=5;
        if(n%2==0&&n>0)
        document.write("number is even and positive"+"<br>");
        else if(n%2!=0&&n<0)
        document.write("number is odd and negative"+"<br>");
        else if(n%2==0&&n<0)
        document.write("number is even and negative"+"<br>");
        else if(n%2!=0&&n>0)
        document.write("number is odd and positive"+"<br>");
        else
        document.write("special number"+"<br>");
        var a=5,b=90,c=67;
        if(a>b&&a>c)
        document.write("a is greatest"+"<br>");
        else if(b>a&&b>c)
        document.write("b is greatest"+"<br>");
        else
        document.write("c is greatest"+"<br>");
        var bs=24500,ta,da,hra,gs;
        ta=0.05*bs;
        da=0.075*bs;
        hra=0.1*bs;
        gs=bs+ta+da+hra;
        if(gs>=100000)
        document.write("a grade employee"+"<br>");
        else if(gs>=75000&&gs<100000)
        document.write("b grade employee"+"<br>");
        else if(gs>=50000&&gs<75000)
        document.write("c grade employee"+"<br>");
        else if(gs>=20000&&gs<50000)
        document.write("d grade employee"+"<br>");
        else
        document.write("e grade employee"+"<br>");
        var hr=17,amt;
        if(hr>=1&&hr<=8)
        amt=100;
        else if(hr>=9&&hr<=12)
        amt=100+(hr-8)*20;
        else if(hr>=13&&hr<=16)
        amt=180+(hr-12)*40;
        else if(hr>=17&&hr<=20)
        amt=340+(hr-16)*60;
        else if(hr>=21&&hr<=24)
        amt=580+(hr-20)*80;
        document.write("amount earned by the worker="+amt); 
    </script>
</head>
<body>
    
</body>
</html>
