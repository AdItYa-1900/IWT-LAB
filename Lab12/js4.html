    <title>JS4</title>
    <script>
        var r=parseFloat(prompt("Enter The Radius:"));
        var area=3.14*r*r;
        var circum=2*3.14*r;
        document.write("The area of the circle is: " + area + "<br>");
        document.write("The circumference of the circle is: " + circum);
    </script>
