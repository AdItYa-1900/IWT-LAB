<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitwise</title>
    <script>
        var a=2,b=5,c;
        c=a<<b;
        document.write("The value of c is: " + c);
        var d=~a;
        document.write("<br>The value of d is: " + d);
        var e=a&b;
        document.write("<br>The value of e is: " + e);
    </script>
</head>
<body>
    
</body>
</html>
