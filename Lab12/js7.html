<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS7</title>
    <script> 
        var a=parseFloat(prompt("Enter The First Number:"));
        var b=parseFloat(prompt("Enter The Second Number:"));
        a=a+b;
        b=a-b;
        a=a-b;
        document.write("After Swapping: <br>");
        document.write("First Number: " + a + "<br>");
        document.write("Second Number: " + b);</script>
</head>
<body>
    
</body>
</html>
