<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS3</title>
    <script>
        var a=parseInt(prompt("Enter the first number:"));
        var b=parseInt(prompt("Enter the second number:"));
        var c=a+b;
        var d=a-b;
        var e=a*b;
        var f=a/b;
        var g=a%b;
        document.write("The sum of a and b is: " + c + "<br>");
        document.write("The difference of a and b is: " + d + "<br>");
        document.write("The product of a and b is: " + e + "<br>");
        document.write("The quotient of a and b is: " + f + "<br>");
        document.write("The remainder of a and b is: " + g + "<br>");
    </script>
</head>
<body>
    
</body>
</html>
