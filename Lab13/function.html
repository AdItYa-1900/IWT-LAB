<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
    <script>
        function addition(a,b){
            return c=a+b;
        }
        document.write("Addition of 5 & 4:"+addition(5,4)+"<br>");
        var f=1;
        function factorial(a){
            while(a!=0){
                f=f*a;
                a--;
            }
            return f;
        }
        document.write("Factorial of 6 is:"+factorial(6)+"<br>");
        var a=parseInt(prompt("Enter first number:"));
        var b=parseInt(prompt("Enter second number:"));
        var e=a+b;
        confirm("Would you like to see the output:");
        document.write("Addition is:"+e+"<br>")
    </script>
