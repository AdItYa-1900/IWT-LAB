<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
div {
width: 100px;
height: 100px;
background: red;
animation-name: example;
animation-duration: 10s;
}
@keyframes example
{
0%{background: rgb(255, 102, 0);}
25%{background: yellow;}
50%{background: blue;}
100%{background: green;}
}
</style>
</head>
<body>
<div></div>
</head>
<body>
</html>
